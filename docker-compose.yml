# Local Postgres for development and tests:  docker compose up -d db
#   export DATABASE_URL=postgres://fd:fd@localhost:5432/fieldday
#   export TEST_DATABASE_URL=postgres://fd:fd@localhost:5432/postgres GAMEDAY_DATABASE_URL=$TEST_DATABASE_URL
# (Not needed for `npm test`: without TEST_DATABASE_URL the tests use in-process PGlite.)
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: fd, POSTGRES_PASSWORD: fd, POSTGRES_DB: fieldday }
    ports: ["5432:5432"]
    volumes: ["fieldday-pg:/var/lib/postgresql/data"]
volumes:
  fieldday-pg:
