services:
  # ---------------- staging ----------------
  - type: web
    name: fieldday-api-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    autoDeploy: false          # CI triggers deploys through the deploy hook so staging is always first
    envVars:
      - { key: DEPLOY_ENV, value: staging }
      - { key: DATABASE_URL, sync: false }            # secret: the STAGING Neon project's connection string (...?sslmode=require)
      - { key: CORS_ORIGINS, sync: false }            # exactly the staging web origin, e.g. https://staging.example.com
      - { key: PUBLIC_BASE_URL, sync: false }         # https://fieldday-api-staging.onrender.com
      - { key: OIDC_ISSUER, sync: false }
      - { key: OIDC_AUDIENCE, sync: false }
      - { key: OIDC_JWKS_URI, sync: false }
      - { key: OIDC_ROLES_CLAIM, value: "https://fieldday.bklabs10.com/roles" }   # Auth0 requires a namespaced custom claim
      - { key: OPENWEATHER_API_KEY, sync: false }     # secret; staging has its own key
      - { key: OTEL_EXPORTER_OTLP_ENDPOINT, sync: false }
      - { key: SEED, value: "1" }                     # synthetic demo data only
  - type: web
    name: fieldday-web-staging
    runtime: static
    buildCommand: npm ci && npm run build -w web
    staticPublishPath: ./web/dist
    autoDeploy: false
    envVars:
      - { key: VITE_API_BASE, sync: false }
      - { key: VITE_OIDC_CLIENT_ID, sync: false }
      - { key: VITE_OIDC_AUTHORITY, sync: false }
      - { key: VITE_OIDC_SCOPES, sync: false }
      - { key: VITE_OIDC_AUDIENCE, value: "https://fieldday-api" }
      - { key: VITE_OIDC_ROLES_CLAIM, value: "https://fieldday.bklabs10.com/roles" }
    routes:
      - { type: rewrite, source: /*, destination: /index.html }
    headers: &web_headers
      - { path: /assets/*, name: Cache-Control, value: "public, max-age=31536000, immutable" }
      - { path: /index.html, name: Cache-Control, value: "no-cache" }
      - { path: /, name: Cache-Control, value: "no-cache" }
      - { path: /*, name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
      - { path: /*, name: X-Content-Type-Options, value: nosniff }
      - { path: /*, name: Referrer-Policy, value: no-referrer }
      - { path: /*, name: Permissions-Policy, value: "geolocation=(), camera=(), microphone=()" }
      - { path: /*, name: Content-Security-Policy, value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://fieldday-api-staging.onrender.com https://dev-w8cs0spu2cm1cvzu.us.auth0.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" }

  # ---------------- production ----------------
  - type: web
    name: fieldday-api-prod
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - { key: DEPLOY_ENV, value: production }
      - { key: DATABASE_URL, sync: false }            # secret: the PRODUCTION Neon project's connection string (a different project)
      - { key: CORS_ORIGINS, sync: false }
      - { key: PUBLIC_BASE_URL, sync: false }
      - { key: OIDC_ISSUER, sync: false }
      - { key: OIDC_AUDIENCE, sync: false }
      - { key: OIDC_JWKS_URI, sync: false }
      - { key: OIDC_ROLES_CLAIM, value: "https://fieldday.bklabs10.com/roles" }   # Auth0 requires a namespaced custom claim
      - { key: OPENWEATHER_API_KEY, sync: false }
      - { key: OTEL_EXPORTER_OTLP_ENDPOINT, sync: false }
      - { key: SEED, value: "1" }
  - type: web
    name: fieldday-web-prod
    runtime: static
    buildCommand: npm ci && npm run build -w web
    staticPublishPath: ./web/dist
    autoDeploy: false
    envVars:
      - { key: VITE_API_BASE, sync: false }
      - { key: VITE_OIDC_CLIENT_ID, sync: false }
      - { key: VITE_OIDC_AUTHORITY, sync: false }
      - { key: VITE_OIDC_SCOPES, sync: false }
      - { key: VITE_OIDC_AUDIENCE, value: "https://fieldday-api" }
      - { key: VITE_OIDC_ROLES_CLAIM, value: "https://fieldday.bklabs10.com/roles" }
    routes:
      - { type: rewrite, source: /*, destination: /index.html }
    headers:
      - { path: /assets/*, name: Cache-Control, value: "public, max-age=31536000, immutable" }
      - { path: /index.html, name: Cache-Control, value: "no-cache" }
      - { path: /, name: Cache-Control, value: "no-cache" }
      - { path: /*, name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
      - { path: /*, name: X-Content-Type-Options, value: nosniff }
      - { path: /*, name: Referrer-Policy, value: no-referrer }
      - { path: /*, name: Permissions-Policy, value: "geolocation=(), camera=(), microphone=()" }
      - { path: /*, name: Content-Security-Policy, value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://fieldday-api-prod.onrender.com https://dev-w8cs0spu2cm1cvzu.us.auth0.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" }